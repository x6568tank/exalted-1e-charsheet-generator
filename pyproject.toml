[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "exalted-builder"
version = "1.0.0"
description = "Character builder and validator for Exalted 1st Edition"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    # The PDF sheet and the tests that read it back. Both are dev-time needs too:
    # tests/test_pdf.py renders real documents and extracts their text.
    "reportlab>=4",
    "pypdf>=4",
]
ui = [
    "nicegui>=2",
    # ui/pdf.py — the printable character sheet. A hard requirement of the UI, not
    # an optional extra within it: the Print button is always on the header bar.
    "reportlab>=4",
]
# Tools needed to build a standalone executable (see pack/). TWO products build from
# this tree and `desktop` is just the toolchain shared by both: pair it with `ui` for
# the browser build (`pack/exalted-builder.spec`) or with `qt` for the native PySide6
# one (`pack/exalted-builder-qt.spec`). ⚠ The old note here said the packaged app
# always opens in a browser and needs no Qt — true until decision 0018 shipped a
# native app; nicegui stays listed because the webapp build is still a product.
desktop = [
    "nicegui>=2",
    "reportlab>=4",
    "pyinstaller>=6",
]
# The PySide6 native app (decision 0018) and its offscreen test story. Optional:
# the NiceGUI webapp and the dev/test toolchain run without it.
qt = [
    "PySide6>=6.7",
    "pytest-qt>=4",
]

# Auto-discovers exalted_builder and any subpackages (models now; engine, ui
# later once they have an __init__.py), so this doesn't break before they exist.
[tool.setuptools.packages.find]
include = ["exalted_builder*"]

# Ship the rules data and vendored JS with the package so they're found after install.
[tool.setuptools.package-data]
exalted_builder = ["data/*.json", "data/charms/*.json", "ui/vendor/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "auto" so the NiceGUI User-simulation fixture's async tests are collected
# without each needing an explicit @pytest.mark.asyncio.
asyncio_mode = "auto"
markers = [
    "nicegui_main_file: path to the NiceGUI 'main file' for the User-simulation fixture",
]
