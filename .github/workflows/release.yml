name: build-release

on:
  push:
    tags: ["v*"]          # a tag like v0.4.2 triggers a real release
  workflow_dispatch: {}   # ...and you can run it by hand to test the build

permissions:
  contents: write         # GITHUB_TOKEN is read-only by default; releases need write

jobs:
  # ONE PRODUCT builds from this tree: the native Qt app (decision 0021 retired the
  # packaged webapp; the browser product is the hosted site). The matrix is 2 OSes,
  # and every row carries its own extras and spec, so a second product is one more row.
  #
  # ⚠ Until 2026-08-28 this matrix had only the two ExaltedBuilder rows, so a tag
  # published a release that LOOKED complete — two green assets — with no native app
  # on it at all. The Qt spec had existed since the packaging commit and nothing in CI
  # referenced it; the by-hand build scripts were its only callers.
  build:
    name: ${{ matrix.asset }}
    strategy:
      fail-fast: false    # a Windows failure shouldn't discard the Linux artifact
      matrix:
        include:
          - os: ubuntu-22.04
            extras: desktop,qt
            spec: pack/exalted-builder-qt.spec
            binary: dist/ExaltedBuilderQt
            asset: ExaltedBuilderQt-linux-x86_64
          - os: windows-latest
            extras: desktop,qt
            spec: pack/exalted-builder-qt.spec
            binary: dist/ExaltedBuilderQt.exe
            asset: ExaltedBuilderQt-windows-x86_64.exe
          # - os: macos-latest          # arm64; unsigned -> Gatekeeper quarantines it
          #   extras: desktop,qt
          #   spec: pack/exalted-builder-qt.spec
          #   binary: dist/ExaltedBuilderQt
          #   asset: ExaltedBuilderQt-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"        # build on your requires-python floor

      - name: Install app + build tools
        run: python -m pip install ".[${{ matrix.extras }}]"   # non-editable: matches what ships

      # ⚠ A headless runner builds a GUI app fine — PyInstaller only COLLECTS the Qt
      # platform plugins, it never opens a window. What needs a display is running the
      # result, which happens on the user's machine.
      - name: Build
        run: pyinstaller ${{ matrix.spec }}

      - name: Rename artifact
        shell: bash                     # git-bash exists on the Windows runner too
        run: mv "${{ matrix.binary }}" "${{ matrix.asset }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}     # unique per row: v4 refuses a duplicate name
          path: ${{ matrix.asset }}

      # Each row attaches its own file to the ONE release the tag created, so a tag
      # ships every asset together (the human's call, 2026-08-28).
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
